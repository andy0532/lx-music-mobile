name: Build

on:
  push:
    branches:
      - master
      - glass-themes

jobs:
  Android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - name: Check out git repository
        uses: actions/checkout@v4

      - name: Setup Env
        uses: ./.github/actions/setup

      # 在构建前把commit hash写入package.json版本号，APK名自动带hash
      # 同时更新publish/version.json（不含hash，用于APP更新比较）
      - name: Set package version with commit hash
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          BASE_VERSION=$(node -p "require('./package.json').version")
          FULL_VERSION="${BASE_VERSION}-${COMMIT_HASH}"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.version='${FULL_VERSION}';fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "PACKAGE_VERSION=${FULL_VERSION}" >> $GITHUB_ENV
          echo "BASE_VERSION=${BASE_VERSION}" >> $GITHUB_ENV
          echo "APK Version: ${BASE_VERSION} → ${FULL_VERSION}"

          # 更新publish/version.json和package.json的versionCode(保持同步)
          NEW_VC=$(($(node -p "require('./publish/version.json').versionCode||77")+1))
          COMMIT_MSG=$(git log -1 --pretty=%B | head -1)
          COMMIT_DATE=$(date '+%Y-%m-%d')
          DESC="毛玻璃主题定制版 ${FULL_VERSION}\n更新日期: ${COMMIT_DATE}\n更新内容: ${COMMIT_MSG}"
          node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('publish/version.json'));v.version='${BASE_VERSION}';v.versionCode=${NEW_VC};v.desc='${DESC}';fs.writeFileSync('publish/version.json',JSON.stringify(v,null,2)+'\n')"
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json'));p.versionCode=${NEW_VC};fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
          echo "versionCode updated to ${NEW_VC} in both publish/version.json and package.json"

      - name: Build Packages
        env:
          DISABLE_SVG: 1
        shell: bash
        run: |
          echo "storeFile=debug.keystore" > android/keystore.properties
          echo "storePassword=android" >> android/keystore.properties
          echo "keyAlias=androiddebugkey" >> android/keystore.properties
          echo "keyPassword=android" >> android/keystore.properties
          cd android
          ./gradlew assembleRelease

      # Push tag to GitHub if package.json version's tag is not tagged
      - name: Create git tag
        uses: pkgdeps/git-tag-action@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.PACKAGE_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "v"

      - name: Generate file MD5
        run: |
          cd android/app/build/outputs/apk/release
          md5sum *.apk

      - name: Upload Artifact
        uses: ./.github/actions/upload-artifact
        env:
          PACKAGE_VERSION: ${{ env.PACKAGE_VERSION }}

