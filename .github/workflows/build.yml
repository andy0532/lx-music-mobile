name: Build APK

on:
  push:
    branches: [car-mode]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm install
      - run: |
          cd android
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cd app
          keytool -genkey -v -keystore release.keystore -alias release -keyalg RSA -keysize 2048 -validity 10000 -storepass android -keypass android -dname "CN=Car,OU=Car,O=Car,L=Car,ST=Car,C=CN"
          cat > ../keystore.properties << KSEOF
          storeFile=app/release.keystore
          storePassword=android
          keyAlias=release
          keyPassword=android
          KSEOF
          cd ..
          ./gradlew assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: android/app/build/outputs/apk/release/app-release.apk
